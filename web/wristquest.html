// 6. SEÑAL SIMULADA: envolvente RMS de un polo asimétrico + ruido
//    dependiente de la señal; histéresis; IMU como resorte amortiguado
// =====================================================================
const sig = new Float32Array(2), env = new Float32Array(2), nzs = new Float32Array(2), act = new Uint8Array(2);

  for (let c = 0; c < 2; c++) {
    let tg = 0.02;
    if (!FREE && keys[c === 0 ? K_UP : K_DN]) tg = keys[K_SH] ? CFG.actWeak : CFG.actStrong;
    if (simT - extT[c] < 0.25) tg = extV[c];
    // ataque rápido / liberación lenta: equivale a la ventana RMS de 100-200 ms del GDD
    const tau = tg > env[c] ? CFG.tauAtk : CFG.tauRel;
    env[c] += (tg - env[c]) * (1 - Math.exp(-dt / tau));
    // ruido pasa-bajas; su desviación crece con la activación (ruido dependiente de la señal)
    nzs[c] += ((Math.random() + Math.random() + Math.random() - 1.5) * 2 - nzs[c]) * 0.3;
    const s = env[c] + nzs[c] * (0.004 + 0.1 * env[c]);
    sig[c] = s < 0 ? 0 : s;
    if (!act[c]) { if (sig[c] >= CFG.thrOn) act[c] = 1; }
    else if (sig[c] < CFG.thrOn * CFG.hyst) act[c] = 0;
  }

  else {
    let u = 0; if (!FREE) { if (keys[K_LT]) u -= 1; if (keys[K_RT]) u += 1; if (keys[K_SH]) u *= 0.4; }
    // segundo orden: wn = 8 rad/s, zeta ~ 0.9; con tecla sostenida llega a p0 ± 70°

function bakeLogo() {   // "Wrist" + Q de poción inclinada (el cuello es la cola de la Q) + "uest", en cartulina recortada
  const size = 190, font = '700 ' + size + 'px ' + DSP, m = mkCanvas(4, 4).getContext('2d'); m.font = font;
  const wA = m.measureText('Wrist').width, wB = m.measureText('uest').width, r = size * 0.37, qw = r * 2.45, tw = wA + qw + wB;
  makeSprite(SP_T_LOGO, tw + size * 0.9, size * 2.1, 1, (g, s) => {
    const x0 = -tw / 2, yb = size * 0.3, qx = x0 + wA + qw / 2, qy = yb - size * 0.36, ang = 2.5;   // ang: el cuello apunta abajo a la derecha
    const nw = r * 0.6, nT = -r * 1.3, cTop = nT - r * 0.5;   // cuello corto y corcho ancho: se lee como poción, no como lupa
    g.font = font; g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
    // 1) cartulina crema de respaldo para letras y poción, con su sombra
    g.shadowColor = 'rgba(8,4,20,0.55)'; g.shadowOffsetX = 6 * s; g.shadowOffsetY = 8 * s; g.shadowBlur = 8 * s;
    g.strokeStyle = C.cream; g.lineWidth = size * 0.24; g.strokeText('Wrist', x0, yb); g.strokeText('uest', x0 + wA + qw, yb);
    g.save(); g.translate(qx, qy); g.rotate(ang); glassPath(g, 0, 0, r, nw, cTop, true); g.fillStyle = C.cream; g.fill(); g.stroke(); g.restore();
    g.shadowColor = 'rgba(0,0,0,0)';
    // 2) letras recortadas en degradado del logotipo, con brillo de papel
    const gr = g.createLinearGradient(x0, 0, x0 + tw, 0); gr.addColorStop(0, '#0e92ad'); gr.addColorStop(0.55, '#2fb98a'); gr.addColorStop(1, '#7ad957');
    g.fillStyle = '#d9fff3'; g.fillText('Wrist', x0 - 4, yb - 5); g.fillText('uest', x0 + wA + qw - 4, yb - 5);   // canto de luz: capa clara debajo, sin trazos que crucen las letras
    g.fillStyle = gr; g.fillText('Wrist', x0, yb); g.fillText('uest', x0 + wA + qw, yb);
    // 3) la Q: matraz de papel inclinado; el líquido se queda horizontal y llena el cuello, que ahora está abajo
    g.save(); g.translate(qx, qy); g.rotate(ang);
    g.beginPath(); rrect(g, -nw * 0.46, cTop, nw * 0.92, r * 0.78, r * 0.12); piece(C.cork, 0.8);
    g.beginPath(); g.ellipse(0, cTop + r * 0.08, nw * 0.36, r * 0.07, 0, 0, TAU); piece(C.corkLt, 0.3);
    glassPath(g, 0, 0, r, nw, nT, true); pfill('rgba(205,214,255,0.55)', 0.6);
    g.save(); glassPath(g, 0, 0, r * 0.92, nw * 0.74, nT, true); g.clip(); g.rotate(-ang);
    g.beginPath(); g.moveTo(-3 * r, r * 0.02); g.quadraticCurveTo(-r, -r * 0.1, 0, r * 0.02); g.quadraticCurveTo(r, r * 0.14, 3 * r, 0); g.lineTo(3 * r, 3 * r); g.lineTo(-3 * r, 3 * r); g.closePath(); piece('#22a98f', 0.6);
    g.beginPath(); g.ellipse(-r * 0.15, r * 0.42, r * 0.5, r * 0.22, 0.2, 0, TAU); piece('#7ad957', 0.4);
    for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(-r * 0.4 + k * r * 0.28, r * (0.62 - k * 0.12), r * (0.05 + 0.02 * k), 0, TAU); piece('rgba(255,255,255,0.8)', 0.2); }
    g.restore();
    glassPath(g, 0, 0, r, nw, nT, false); g.strokeStyle = C.glassRim; g.lineWidth = r * 0.12; shOn(g, 0.6); g.stroke(); shOff(g); g.strokeStyle = EDGE; g.lineWidth = 2; g.stroke();
    g.beginPath(); rrect(g, -nw * 0.64, nT - r * 0.05, nw * 1.28, r * 0.18, r * 0.07); piece(C.glassLt, 0.6);
    crescent(g, 0, 0, r * 0.8, r * 0.66, -2.75 - ang, -2.0 - ang); piece('#ffffff', 0.3);   // reflejo arriba a la izquierda del mundo, no del frasco
    g.restore();
  });
}
function titleSprite(id, str, size, style) {

      g.fillStyle = '#d9fff3'; g.fillText(str, -size * 0.022, -size * 0.03); g.fillStyle = gr; g.fillText(str, 0, 0);   // canto de luz sin trazos internos
    } else { g.font = '700 ' + size + 'px ' + DSP; g.fillStyle = '#3b1240'; g.fillText(str, 0, 0); }

  ws.onmessage = function (ev) {

      case 'hola': MOT.version = m.version | 0; MOT.fuente = m.fuente || ''; oscSus = 0; break;   // conexión nueva: nada suscrito
      case 'osc': oscRecibir(m); break;

      case 'estado':

        MOT.activa = m.activa ? 1 : 0; MOT.calibrado = m.calibrado ? 1 : 0; MOT.errorFuente = m.error_fuente || ''; MOT.sesion = m.sesion || null;
        if (m.calidad) for (let i = 0; i < 4; i++) { const q = CAL_IDX[m.calidad[i]]; MOT.calidad[i] = q === undefined ? -1 : q; }
        break;

// ---- Sesión de paciente y eventos: el juego solo avisa; el motor registra, calcula y exporta ----
const COD_PERFIL = ['DEMO-CLINICO', 'PRUEBA01'];   // seudónimos de demostración, nunca nombres
const MOV_EVT = ['extension', 'flexion', 'pronacion', 'supinacion', 'cofre', 'distractor'];
let exId = 0, exAbierto = -1;
function motorSesion(codigo) { motorEnviar({ cmd: 'sesion', accion: 'iniciar', codigo: codigo }); }
function motorEvento(tipo, kind, res) {
  if (!MOT.on || !MOT.sesion) return;
  if (tipo === 'ejercicio_inicio') {
    if (exAbierto >= 0) motorEnviar({ cmd: 'evento', tipo: 'ejercicio_fin', id: exAbierto, resultado: 'interrumpido', rt_s: null });
    exAbierto = ++exId;
    motorEnviar({ cmd: 'evento', tipo: tipo, id: exAbierto, movimiento: MOV_EVT[kind] || 'otro' });
  } else if (tipo === 'ejercicio_fin') {
    if (exAbierto < 0) return;
    motorEnviar({ cmd: 'evento', tipo: tipo, id: exAbierto, resultado: res === 1 ? 'acierto' : res === -2 ? 'tiempo' : 'fallo',
      rt_s: EX.rt >= 0 ? Math.round(EX.rt * 1000) / 1000 : null });
    exAbierto = -1;
  } else if (tipo === 'interrumpir') {   // salir a mitad de un ejercicio: queda registrado como interrumpido
    if (exAbierto >= 0) motorEnviar({ cmd: 'evento', tipo: 'ejercicio_fin', id: exAbierto, resultado: 'interrumpido', rt_s: null });
    exAbierto = -1;
  } else motorEnviar({ cmd: 'evento', tipo: tipo });
}

// ---- Monitor de señal: osciloscopio de los cuatro canales filtrados ----
// El motor manda mínimo y máximo por cubeta de 10 ms, 10 veces por segundo; cada cubeta es una
// línea vertical, así la traza conserva sus picos. Entre mensajes el trazo avanza de forma continua
// (se interpola el desplazamiento), por eso no salta cada 100 ms. Un hueco (null) queda en blanco.
const OSC_N = 400, OSC_COL = ['#3b5bdb', '#d6336c', '#0f8f8a', '#a83fb5'];
const oscMin = [], oscMax = [], oscEsc = new Float32Array(4).fill(100), oscPico = new Float32Array(4);
for (let c = 0; c < 4; c++) { oscMin.push(new Float32Array(OSC_N).fill(NaN)); oscMax.push(new Float32Array(OSC_N).fill(NaN)); }

let acc = 0, last = -1;

  let n = 0;
  while (acc >= DT && n < 5) { CH.px = CH.x; CH.py = CH.y; update(DT); acc -= DT; n++; }
  if (n === 5 && acc > DT) acc = 0;   // descarta la deuda: evita la espiral de la muerte

}
