// =====================================================================
// 6. SEÑAL SIMULADA: envolvente RMS de un polo asimétrico + ruido
//    dependiente de la señal; histéresis; IMU como resorte amortiguado
// =====================================================================
const sig = new Float32Array(2), env = new Float32Array(2), nzs = new Float32Array(2), act = new Uint8Array(2);
const extT = new Float64Array(3), extV = new Float32Array(3);   // datos externos (WQ.feed): 0 ECRB, 1 FCU, 2 IMU°
extT.fill(-99);
let imu = 0, imuV = 0, armed = 1, simT = 0, FREE = 0, decCo = 0;
function phi0() { return CFG.posture ? -60 : 0; }
function updSignals(dt) {
  for (let c = 0; c < 2; c++) {
    let tg = 0.02;
    if (!FREE && keys[c === 0 ? K_UP : K_DN]) tg = keys[K_SH] ? CFG.actWeak : CFG.actStrong;
    if (simT - extT[c] < 0.25) tg = extV[c];
    // ataque rápido / liberación lenta: equivale a la ventana RMS de 100-200 ms del GDD
    const tau = tg > env[c] ? CFG.tauAtk : CFG.tauRel;
    env[c] += (tg - env[c]) * (1 - Math.exp(-dt / tau));
    // ruido pasa-bajas; su desviación crece con la activación (ruido dependiente de la señal)
    nzs[c] += ((Math.random() + Math.random() + Math.random() - 1.5) * 2 - nzs[c]) * 0.3;
    const s = env[c] + nzs[c] * (0.004 + 0.1 * env[c]);
    sig[c] = s < 0 ? 0 : s;
    if (!act[c]) { if (sig[c] >= CFG.thrOn) act[c] = 1; }
    else if (sig[c] < CFG.thrOn * CFG.hyst) act[c] = 0;
  }
  const p0 = phi0();
  if (simT - extT[2] < 0.25) { imu += (extV[2] - imu) * (1 - Math.exp(-dt / 0.05)); imuV = 0; }
  else {
    let u = 0; if (!FREE) { if (keys[K_LT]) u -= 1; if (keys[K_RT]) u += 1; if (keys[K_SH]) u *= 0.4; }
    // segundo orden: wn = 8 rad/s, zeta ~ 0.9; con tecla sostenida llega a p0 ± 70°
    const a = 4480 * u - 64 * (imu - p0) - 14.4 * imuV;
    imuV += a * dt; imu += imuV * dt;
    if (imu > 90) { imu = 90; imuV = 0; } else if (imu < -90) { imu = -90; imuV = 0; }
  }
  if (!armed && sig[0] < CFG.rest && sig[1] < CFG.rest && Math.abs(imu - p0) < 12) armed = 1;
}

}

function exUpdate(dt) {
  if (!EX.run) return 0;
  if (!EX.started) { if (armed) EX.started = 1; else return 0; }   // la ventana corre solo desde reposo
  EX.win += dt;
  const th = CFG.imuTheta;
  let on = 0, wrong = 0;
  if (EX.kind === KX_LOCK) {
    const d = imu - phi0(), tp = CFG.posture ? 2 * th : th, tn = CFG.posture ? 0.3 * th : -th;
    if ((EX.side > 0 && d >= tp) || (EX.side < 0 && d <= tn)) { EX.turns++; EX.side = -EX.side; sfxClick(); if (EX.rt < 0) EX.rt = EX.win; }
    EX.prog = EX.turns / CFG.lockTurns;
    if (EX.turns >= CFG.lockTurns) { EX.run = 0; armed = 0; return 1; }
    if (EX.win >= EX.winMax) { EX.run = 0; armed = 0; return -2; }
    return 0;
  }
  if (EX.kind === KX_NOGO) {   // distractor: el acierto es NO moverse durante la ventana (control inhibitorio)
    const moved = act[0] || act[1] || Math.abs(imu - phi0()) >= th;

    if (EX.win >= EX.winMax) { EX.run = 0; armed = 0; return 1; }
    return 0;
  }
  if (EX.kind === KX_EXT) { on = act[0]; wrong = act[1]; }
  else if (EX.kind === KX_FLEX) { on = act[1]; wrong = act[0]; }
  else { on = imuDir(EX.kind) >= th ? 1 : 0; wrong = (act[0] || act[1] || imuDir(EX.kind === KX_SUP ? KX_PRON : KX_SUP) >= th) ? 1 : 0; }
  if (on) { if (EX.rt < 0) EX.rt = EX.win; EX.holdT += dt; if (EX.holdT >= CFG.hold) { EX.run = 0; armed = 0; return 1; } }
  else EX.holdT = Math.max(0, EX.holdT - dt * 2);
  if (wrong && !on) { EX.wrongT += dt; if (EX.wrongT >= CFG.hold) { EX.run = 0; armed = 0; return -1; } } else EX.wrongT = 0;
  if (EX.win >= EX.winMax) { EX.run = 0; armed = 0; return -2; }

function bakeLogo() {   // "Wrist" + Q de poción inclinada (el cuello es la cola de la Q) + "uest", en cartulina recortada
  const size = 190, font = '700 ' + size + 'px ' + DSP, m = mkCanvas(4, 4).getContext('2d'); m.font = font;
  const wA = m.measureText('Wrist').width, wB = m.measureText('uest').width, r = size * 0.37, qw = r * 2.45, tw = wA + qw + wB;
  makeSprite(SP_T_LOGO, tw + size * 0.9, size * 2.1, 1, (g, s) => {
    const x0 = -tw / 2, yb = size * 0.3, qx = x0 + wA + qw / 2, qy = yb - size * 0.36, ang = 2.5;   // ang: el cuello apunta abajo a la derecha
    const nw = r * 0.6, nT = -r * 1.3, cTop = nT - r * 0.5;   // cuello corto y corcho ancho: se lee como poción, no como lupa
    g.font = font; g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
    // 1) cartulina crema de respaldo para letras y poción, con su sombra
    g.shadowColor = 'rgba(8,4,20,0.55)'; g.shadowOffsetX = 6 * s; g.shadowOffsetY = 8 * s; g.shadowBlur = 8 * s;
    g.strokeStyle = C.cream; g.lineWidth = size * 0.24; g.strokeText('Wrist', x0, yb); g.strokeText('uest', x0 + wA + qw, yb);
    g.save(); g.translate(qx, qy); g.rotate(ang); glassPath(g, 0, 0, r, nw, cTop, true); g.fillStyle = C.cream; g.fill(); g.stroke(); g.restore();
    g.shadowColor = 'rgba(0,0,0,0)';
    // 2) letras recortadas en degradado del logotipo, con brillo de papel
    const gr = g.createLinearGradient(x0, 0, x0 + tw, 0); gr.addColorStop(0, '#0e92ad'); gr.addColorStop(0.55, '#2fb98a'); gr.addColorStop(1, '#7ad957');
    g.fillStyle = '#d9fff3'; g.fillText('Wrist', x0 - 4, yb - 5); g.fillText('uest', x0 + wA + qw - 4, yb - 5);   // canto de luz: capa clara debajo, sin trazos que crucen las letras
    g.fillStyle = gr; g.fillText('Wrist', x0, yb); g.fillText('uest', x0 + wA + qw, yb);
    // 3) la Q: matraz de papel inclinado; el líquido se queda horizontal y llena el cuello, que ahora está abajo
    g.save(); g.translate(qx, qy); g.rotate(ang);
    g.beginPath(); rrect(g, -nw * 0.46, cTop, nw * 0.92, r * 0.78, r * 0.12); piece(C.cork, 0.8);
    g.beginPath(); g.ellipse(0, cTop + r * 0.08, nw * 0.36, r * 0.07, 0, 0, TAU); piece(C.corkLt, 0.3);
    glassPath(g, 0, 0, r, nw, nT, true); pfill('rgba(205,214,255,0.55)', 0.6);
    g.save(); glassPath(g, 0, 0, r * 0.92, nw * 0.74, nT, true); g.clip(); g.rotate(-ang);
    g.beginPath(); g.moveTo(-3 * r, r * 0.02); g.quadraticCurveTo(-r, -r * 0.1, 0, r * 0.02); g.quadraticCurveTo(r, r * 0.14, 3 * r, 0); g.lineTo(3 * r, 3 * r); g.lineTo(-3 * r, 3 * r); g.closePath(); piece('#22a98f', 0.6);
    g.beginPath(); g.ellipse(-r * 0.15, r * 0.42, r * 0.5, r * 0.22, 0.2, 0, TAU); piece('#7ad957', 0.4);
    for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(-r * 0.4 + k * r * 0.28, r * (0.62 - k * 0.12), r * (0.05 + 0.02 * k), 0, TAU); piece('rgba(255,255,255,0.8)', 0.2); }
    g.restore();
    glassPath(g, 0, 0, r, nw, nT, false); g.strokeStyle = C.glassRim; g.lineWidth = r * 0.12; shOn(g, 0.6); g.stroke(); shOff(g); g.strokeStyle = EDGE; g.lineWidth = 2; g.stroke();
    g.beginPath(); rrect(g, -nw * 0.64, nT - r * 0.05, nw * 1.28, r * 0.18, r * 0.07); piece(C.glassLt, 0.6);
    crescent(g, 0, 0, r * 0.8, r * 0.66, -2.75 - ang, -2.0 - ang); piece('#ffffff', 0.3);   // reflejo arriba a la izquierda del mundo, no del frasco
    g.restore();
  });
}

      g.lineWidth = size * 0.24; g.strokeStyle = C.cream; g.strokeText(str, 0, 0); g.shadowColor = 'rgba(0,0,0,0)';
      g.fillStyle = '#d9fff3'; g.fillText(str, -size * 0.022, -size * 0.03); g.fillStyle = gr; g.fillText(str, 0, 0);   // canto de luz sin trazos internos
    } else { g.font = '700 ' + size + 'px ' + DSP; g.fillStyle = '#3b1240'; g.fillText(str, 0, 0); }

const SHEET_SC = [1, 1, 1, 1, 0.8, 1, 1, 0.42, 0.8, 1.4, 1.6, 1.6, 1.2, 0.8];
function drawItemSheet() {   // revisión de arte: todos los ítems de papel sobre cartulina neutra
  const g = ctx; g.fillStyle = C.panel; g.fillRect(0, 0, W, H);
  for (let i = 0; i < SHEET_IDS.length; i++) { const x = W * (0.09 + (i % 7) * 0.137), y = i < 7 ? 300 : 760; drawSpr(SHEET_IDS[i], x, y, SHEET_SC[i]); }
}
function render(alpha) {
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = C.navy; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(pxs, 0, 0, pxs, offX * dpr, offY * dpr);
  const cx = lerp(CH.px, CH.x, alpha), cy = lerp(CH.py, CH.y, alpha), camX = cx - W * 0.3;
  hbN = 0;
  if (itemSheet) { drawItemSheet(); return; }
  if (scene >= SC_MENU) drawUIScene();
  else if (scene <= SC_RUN) {
    drawWorld(camX, cx, cy);
    if (scene === SC_INTRO) drawIntro();
    else {
      const active = cur < stN && stS[cur] === 1 && !FREE;
      drawHUD(active ? (EX.kind === KX_NOGO ? KX_REST : EX.kind) : -1, SP_BLOB);
      if (scene === SC_GO) titleGlow(SP_T_GO, sceneT);
      if (FREE) tag('Modo libre: ← → caminar, ↑ saltar, ↓ agacharse, L para salir', W / 2, 300, F_M, INK_TXT, GOLD_PAPER, TH_M);
    }
  } else if (scene === SC_LOCK) drawLockScene();
  else if (scene === SC_DONE) drawDone();
  else { drawBrewScene(); if (scene === SC_BREWGO) titleGlow(SP_T_BREW, sceneT); }
  g.drawImage(VIG, 0, 0, W, H);
  if (toastT > 0) { g.globalAlpha = clamp(toastT / 0.3, 0, 1); tag(TOASTS[toast], W / 2, H - 70, F_M, INK_TXT, C.cream, TH_M); g.globalAlpha = 1; }
  if (help) drawHelp();
  if (perf) drawPerf();
  if (fadeA > 0) { g.globalAlpha = fadeA; g.fillStyle = '#05081a'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = C.navy;   // barras de letterbox
  if (offX > 0) { g.fillRect(0, 0, offX * dpr, cv.height); g.fillRect(cv.width - offX * dpr, 0, offX * dpr + 1, cv.height); }
  if (offY > 0) { g.fillRect(0, 0, cv.width, offY * dpr); g.fillRect(0, cv.height - offY * dpr, cv.width, offY * dpr + 1); }
}

// =====================================================================
// 13. BUCLE: paso fijo de 60 Hz con acumulador + render interpolado
// =====================================================================
let acc = 0, last = -1;
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts * 0.001; if (last < 0) last = now;
  let ft = now - last; last = now; if (ft > 0.25) ft = 0.25;
  const t0 = performance.now();
  acc += ft;
  let n = 0;
  while (acc >= DT && n < 5) { CH.px = CH.x; CH.py = CH.y; update(DT); acc -= DT; n++; }
  if (n === 5 && acc > DT) acc = 0;   // descarta la deuda: evita la espiral de la muerte
  render(acc / DT);
  FT[ftI] = ft * 1000; ftI = (ftI + 1) % 240;
  cpuMs += (performance.now() - t0 - cpuMs) * 0.05;
  pAcc += ft;
  if (perf && pAcc > 0.5) { pAcc = 0; FTS.set(FT); FTS.sort(); p50 = FTS[120]; p95 = FTS[228]; p99 = FTS[237]; }
}
layout(); bakeAll(); enterScene(SC_MENU); Ph.set(Pc);
window.WQ = {
  cfg: CFG,
  /** Inyecta datos reales: ch 0 ECRB y 1 FCU en fracción de MVC; ch 2 IMU en grados. */
  feed: function (ch, v) { extT[ch] = simT; extV[ch] = v; },
  /** Contrato del decodificador SynapVolit (un mensaje ND-JSON cada ~125 ms):
   *  { clase: 0 reposo | 1 extensión | 2 flexión | 3 pronación | 4 supinación, intensidad: fracción de MVC,
   *    confianza: 0..1, coactivacion: 0..1 (opcional), t: ms }. Bajo minConf se trata como reposo (compuerta). */
  feedDecoder: function (m) {
    const k = m.confianza >= CFG.minConf ? m.clase | 0 : 0, v = clamp(+m.intensidad || 0, 0, 1.5);
    extT[0] = extT[1] = extT[2] = simT; extV[0] = k === 1 ? v : 0; extV[1] = k === 2 ? v : 0;
    extV[2] = phi0() + clamp((k === 4 ? 1 : k === 3 ? -1 : 0) * CFG.imuTheta * v / CFG.thrOn, -90, 90);   // mismo umbral relativo que el EMG
    decCo = clamp(+m.coactivacion || 0, 0, 1);
  },
  skins: SKINS, version: '0.8.0',
  telemetry: function () { return TEL.buf.slice(0, Math.min(TEL.n, TEL.cap) * TEL.w); },
  _dbg: { step: function (k) { for (let i = 0; i < k; i++) { CH.px = CH.x; CH.py = CH.y; update(DT); } render(1); }, key: function (k, d) { keys[k] = d; if (d) hit[k] = 1; }, go: function (s) { enterScene(s); }, click: function (a) { clickA = a; }, motor: function () { return { on: MOT.on, fuente: MOT.fuente, activa: MOT.activa, calibrado: MOT.calibrado, fase: MOT.cal.fase, paso: MOT.cal.paso, calidad: Array.from(MOT.calidad), env: Array.from(MOT.env), act: Array.from(MOT.act), res: MOT.res }; }, music: function () { return { ready: MU.ready, mask: MU.mask, notes: MU.notes, biome: CFG.biome, cut: MU.filt ? MU.filt.frequency.value : 0 }; }, items: function (on) { itemSheet = on ? 1 : 0; }, state: function () { return { scene: scene, cur: cur, stN: stN, st: CH.st, x: CH.x, y: CH.y, pN: pN, step: step, ok: okN, fail: failN, armed: armed, ex: EX.kind, started: EX.started, run: EX.run, side: EX.side, lockRes: lockRes, flyT: flyT, finT: finT }; } }
};
let puenteOn = 0, puenteFuente = 0;   // fuente: 0 ninguna, 1 simulada, 2 serie (la versión publicada no tiene red)
{ const q = new URLSearchParams(location.search), u = q.get('motor') || q.get('puente'); if (u) conectarMotor(u, 1); }
// La fuente incrustada carga de forma asíncrona: al estar lista se rehornean textos y tarjetas con Fredoka
if (document.fonts) document.fonts.load("700 52px 'Fredoka'").then(function () { TW.clear(); bakeAll(); });
requestAnimationFrame(frame);
})();
